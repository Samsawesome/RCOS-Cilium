<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #messages { margin-bottom: 20px; }
        #messages div { padding: 5px; border-bottom: 1px solid #ddd; }
        #local-messages { margin-bottom: 20px; }
        #local-messages div { padding: 5px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Chat Room 2</h1>
    <div id="local-messages"></div>
    <div id="messages"></div>
    <form id="message-form">
        <input type="text" id="message-input" placeholder="Type a message..." required>
        <button type="submit">Send</button>
    </form>
    <div id="admin-messages"></div>

    <script>
        const form = document.getElementById('message-form');
        const input = document.getElementById('message-input');
        const messagesDiv = document.getElementById('messages');
        const localMessagesDiv = document.getElementById('local-messages');
        const adminMessagesDiv = document.getElementById('admin-messages');

        //Render messages in memory when page loaded
        function loadMessages() {
            fetch('/local_messages')
                .then(response => response.json())
                .then(data => {
                    localMessagesDiv.innerHTML = '';
                    data.forEach(msg => {
                        const localMessageDiv = document.createElement('div');
                        localMessageDiv.textContent = msg;
                        localMessageDiv.style.backgroundColor = 'lightblue';
                        localMessagesDiv.appendChild(localMessageDiv);
                    });
                });
            fetch('/messages')
                .then(response => response.json())
                .then(data => {
                    messagesDiv.innerHTML = '';
                    data.forEach(msg => {
                        const messageDiv = document.createElement('div');
                        messageDiv.textContent = msg;
                        messageDiv.style.backgroundColor = 'lightgreen';
                        messagesDiv.appendChild(messageDiv);
                    });
                });
            fetch('/admin_messages')
                .then(response => response.json())
                .then(data => {
                  adminMessagesDiv.innerHTML = '';
                    data.forEach(msg => {
                        const messageDiv = document.createElement('div');
                        adminMessageDiv.textContent = msg;
                        adminMessageDiv.style.backgroundColor = 'lightred';
                        adminMessagesDiv.appendChild(adminMessageDiv);
                    });
                });
        }

        //Send messages to app1 on user input
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const message = input.value;

            fetch('/send_message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message, sender_id: 'app2'  })
            }).then(() => {
                input.value = '';
                loadMessages(); //Reload messages after sending
            }).catch(err => console.error('Error sending message:', err));
        });

        loadMessages();
    </script>
</body>
</html>
