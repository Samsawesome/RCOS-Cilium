<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
    
        h1 {
            text-align: center;
            color: #444;
        }
    
        #messages, #local-messages, #admin-messages {
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
    
        #messages div, #local-messages div, #admin-messages div {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }
    
        #local-messages div {
            background-color: #e0f7fa;
        }
    
        #messages div {
            background-color: #e8f5e9;
        }
    
        #admin-messages div {
            background-color: #ffebee;
        }
    
        form {
            display: flex;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
            gap: 10px;
        }
    
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 16px;
        }
    
        button {
            padding: 10px 20px;
            background-color: #4caf50;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Chat Room 2</h1>
    <div id="local-messages"></div>
    <div id="messages"></div>
    <form id="message-form">
        <input type="text" id="message-input" placeholder="Type a message..." required>
        <button type="submit">Send</button>
    </form>
    <div id="admin-messages"></div>

    <script>
        const form = document.getElementById('message-form');
        const input = document.getElementById('message-input');
        const messagesDiv = document.getElementById('messages');
        const localMessagesDiv = document.getElementById('local-messages');
        const adminMessagesDiv = document.getElementById('admin-messages');

        //Render messages in memory when page loaded
        function loadMessages() {
            fetch('/local_messages')
                .then(response => response.json())
                .then(data => {
                    localMessagesDiv.innerHTML = '';
                    data.forEach(msg => {
                        const localMessageDiv = document.createElement('div');
                        localMessageDiv.textContent = msg;
                        localMessageDiv.style.backgroundColor = 'lightblue';
                        localMessageDiv.style.borderRadius = '10px';
                        localMessageDiv.style.borderBottomRightRadius = '0px'; // Text bubble effect
                        messageDiv.style.textAlign = 'left';
                        messageDiv.style.marginRight = 'auto';
                        messageDiv.style.maxWidth = '70%';
                        localMessagesDiv.appendChild(localMessageDiv);
                    });
                });
            fetch('/messages')
                .then(response => response.json())
                .then(data => {
                    messagesDiv.innerHTML = '';
                    data.forEach(msg => {
                        const messageDiv = document.createElement('div');
                        messageDiv.textContent = msg;
                        messageDiv.style.backgroundColor = 'lightgreen';
                        messageDiv.style.borderRadius = '10px';
                        messageDiv.style.borderBottomLeftRadius = '0px'; // Text bubble effect
                        adminMessageDiv.style.textAlign = 'center'; // or 'left' if you prefer
                        adminMessageDiv.style.margin = '10px auto'; // center horizontally
                        adminMessageDiv.style.maxWidth = '80%';
                        messagesDiv.appendChild(messageDiv);
                    });
                });
            fetch('/admin_messages')
                .then(response => response.json())
                .then(data => {
                  adminMessagesDiv.innerHTML = '';
                    data.forEach(msg => {
                        const messageDiv = document.createElement('div');
                        adminMessageDiv.textContent = msg;
                        adminMessageDiv.style.backgroundColor = 'lightred';
                        messageDiv.style.borderRadius = '10px';
                        adminMessageDiv.style.textAlign = 'center'; // or 'left' if you prefer
                        adminMessageDiv.style.margin = '10px auto'; // center horizontally
                        adminMessageDiv.style.maxWidth = '80%';
                        adminMessagesDiv.appendChild(adminMessageDiv);
                    });
                });
        }

        //Send messages to app1 on user input
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const message = input.value;

            fetch('/send_message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ timestamp: new Date(), message: message, sender_id: 'app2'  })
            }).then(() => {
                input.value = '';
                loadMessages(); //Reload messages after sending
            }).catch(err => console.error('Error sending message:', err));
        });

        loadMessages();
    </script>
</body>
</html>
