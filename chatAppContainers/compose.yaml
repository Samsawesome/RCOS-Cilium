services:
  app1:
    build:
      context: ./app1
    ports:
      - "5000:5000"
    networks:
      - chat-network
      - cilium-net

  app2:
    build:
      context: ./app2
    ports:
      - "5001:5001"
    networks:
      - chat-network
      - cilium-net
  app3:
    build:
      context: ./app3
    ports:
      - "5002:5002"
    networks:
      - chat-network
      - cilium-net

networks:
  chat-network:
    driver: bridge
  cilium-net:
    name: cilium-net